services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD,
          /app/.venv/bin/python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${PRIPRE_BIND_ADDRESS:-127.0.0.1}:${PRIPRE_PORT:-8080}:80'
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/api/health]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
